[build]
  publish = "dist"
  command = "npm ci && npm run build"

[dev]
  targetPort = 3000

# Security headers. Applied to every response (including the /api/*.json
# routes) since none of these headers interfere with JSON consumption.
#
# CSP CDN allowances (jsdelivr/unpkg/cdnjs for Chart.js and Leaflet) exist
# only because those libraries are currently loaded from a CDN at runtime
# (see src/components/ChartLoader.astro, src/components/LeafletLoader.astro).
# Once those are bundled from npm instead, remove the CDN origins from
# script-src/style-src/font-src/img-src below.
[[headers]]
  for = "/*"

  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self' https://*.sanity.studio http://localhost:3333; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; img-src 'self' data: https://cdn.sanity.io https://*.tile.openstreetmap.org https://cdnjs.cloudflare.com; connect-src 'self' https://*.api.sanity.io wss://*.api.sanity.io; frame-src https://challenges.cloudflare.com"
