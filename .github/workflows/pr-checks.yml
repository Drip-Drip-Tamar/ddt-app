name: PR Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # Weekly safety net. NOTE: this does NOT catch EA/SWW upstream API drift —
  # both suites are fully stubbed at the network boundary (vitest's
  # tests/setup/setup.ts sets `global.fetch = vi.fn()`; the Playwright e2e
  # suite stubs every /api/*.json route via page.route() — see
  # IMPROVEMENT-PLAN.md Task 15). Nothing in CI currently exercises the real
  # Environment Agency / South West Water endpoints. This schedule instead
  # re-runs the full pipeline against `main` on a cadence, catching
  # dependency/infra rot (e.g. a transitive package or CI image update
  # silently breaking the build) between pushes. A genuine live-upstream
  # contract check would need a separate, deliberately unstubbed test and is
  # out of scope here.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Run production parity checks
        run: npm run check:prod
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright smoke suite
        run: npx playwright test
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
